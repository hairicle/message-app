name: CI

on:
  push:
    # staging is covered by deploy-staging.yml, which runs this same sequence before deploying —
    # listing it here too would build every commit twice.
    branches: [main, develop, dev2]
  pull_request:
    branches: [main, develop, staging]

# The repo is a single npm workspace root — one lockfile, one install, then per-workspace steps.
# (The previous version still pointed at the pre-monorepo frontend/ and backend/ directories and
# could not have run at all.)
jobs:
  build-and-test:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build shared types
        run: npm run build --workspace=packages/shared

      # The API's types come from the generated Prisma client, so this has to run before any
      # type-check or test. It needs no database — see prisma.config.ts.
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Type-check API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Type-check web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Unit tests (API)
        run: npm test --workspace=apps/api

      - name: Unit tests (web)
        run: npm test --workspace=apps/web

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          # next build only needs this to inline the value; no backend is reachable in CI.
          NEXT_PUBLIC_API_URL: http://localhost:4000
