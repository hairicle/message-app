# Render Blueprint — the API only.
#
# The web app is deployed on Vercel (project `message-app`), not here. See vercel.json and
# docs/staging-deploy.md.
#
# An API service already exists at srv-d90vt6ok1i2s7381e05g; this file documents its shape so it
# can be recreated or duplicated for staging. Applying it as a Blueprint creates a *new* service —
# to change the existing one, edit it in the dashboard to match.
#
# Secrets are deliberately absent. Every value marked `sync: false` must be set in the Render
# dashboard before the first deploy.

services:
  - type: web
    name: messenger-api-staging
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    branch: staging
    plan: free
    region: singapore
    healthCheckPath: /health
    # CI decides when to deploy, so Render must not also deploy on push.
    autoDeploy: false
    envVars:
      # main.ts reads PORT and falls back to 4000; Render assigns it.
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h

      # Supabase — use a SEPARATE project from production. DIRECT_URL must keep the
      # sslmode=verify-full&sslrootcert=./certs/supabase-prod-ca-2021.crt suffix so migrations
      # verify the certificate, matching how the runtime connection is pinned.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        value: messenger-files
      - key: AVATAR_BUCKET
        value: avatars
      - key: STORAGE_REGION
        value: ap-southeast-1

      # A fresh secret for staging; never reuse production's.
      - key: JWT_SECRET
        generateValue: true

      - key: REDIS_URL
        sync: false

      # The Vercel origin the browser loads from. Cross-origin, so the API has to allow it
      # explicitly — set this to the staging web URL, e.g.
      # https://message-app-git-staging-<scope>.vercel.app
      #
      # Required. This was declared here long before any code read it; it is read now, by both the
      # HTTP server and the socket gateway. Left unset the API allows only localhost, so the
      # deployed web app cannot reach it. Scheme and host, no trailing slash; comma-separate several.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
